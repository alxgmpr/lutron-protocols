# OpenOCD configuration for Nucleo-H723ZG (ST-LINK/V3)
source [find interface/stlink.cfg]

# OpenOCD >= 0.13 (incl. HEAD builds) drives ST-LINK through the native "swd"
# transport; 0.12 and earlier only expose the high-level-adapter "hla_swd" and
# fail with "Debug adapter doesn't support 'swd' transport". Try the native one
# and fall back, so `make flash` works on both. (`transport list` only returns a
# banner string, not the list, so it can't be used to decide.)
if {[catch {transport select swd}]} {
    transport select hla_swd
}

source [find target/stm32h7x.cfg]

# Faster adapter speed for ST-LINK/V3
adapter speed 4000

# Reset configuration
reset_config srst_only srst_nogate connect_assert_srst
